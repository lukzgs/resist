<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skynet Infiltration Protocol</title>
  <meta name="description"
    content="A multiplayer social deduction game based on The Resistance with a Terminator-inspired theme. Hunt the infiltrators, complete missions, and save humanity. Play online with 5-10 players." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Rajdhani", "sans-serif"],
            mono: ["Fira Code", "monospace"]
          },
          colors: {
            resistance: "#0ea5e9",
            spy: "#ef4444",
            dark: "#050505",
            card: "#0f172a"
          },
          animation: {
            "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            "float": "float 6s ease-in-out infinite",
            "scan": "scan 4s linear infinite",
            "glitch": "glitch 1s linear infinite",
            "infinite-scroll": "scroll 2s linear infinite"
          },
          keyframes: {
            float: {
              "0%, 100%": { transform: "translateY(0)" },
              "50%": { transform: "translateY(-10px)" }
            },
            scan: {
              "0%": { top: "-10%" },
              "100%": { top: "110%" }
            },
            glitch: {
              "0%": { transform: "translate(0)" },
              "20%": { transform: "translate(-2px, 2px)" },
              "40%": { transform: "translate(-2px, -2px)" },
              "60%": { transform: "translate(2px, 2px)" },
              "80%": { transform: "translate(2px, -2px)" },
              "100%": { transform: "translate(0)" }
            },
            scroll: {
              "0%": { transform: "translateX(-100%)" },
              "100%": { transform: "translateX(200%)" }
            }
          },
          boxShadow: {
            "glow-blue": "0 0 20px -5px rgba(14, 165, 233, 0.6)",
            "glow-red": "0 0 20px -5px rgba(239, 68, 68, 0.6)",
            "glow-gold": "0 0 20px -5px rgba(234, 179, 8, 0.6)"
          }
        }
      }
    };
  </script>
  <style>
    /* Scanlines effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.15;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 999;
    }

    body {
      scrollbar-width: thin;
      scrollbar-color: #334155 #050505;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-dark text-slate-200 min-h-screen selection:bg-resistance selection:text-white">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <main id="root"></main>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
